name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

# The Rust version comes from rust-toolchain.toml.

jobs:
  # Simulation tests. No graphics or audio libraries needed.
  headless-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2
    - name: Run headless tests
      run: cargo test --no-default-features --features headless

  # Make sure the full game still compiles.
  full-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Bevy system dependencies
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config libwayland-dev libxkbcommon-dev
    - uses: Swatinem/rust-cache@v2
    - name: Check full build
      run: cargo check --all-targets
