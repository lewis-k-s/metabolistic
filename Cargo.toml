[package]
name = "metabolistic3d"
version = "0.1.0"
edition = "2024"

[lib]
name = "metabolistic3d"
path = "src/lib.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Core Bevy: ECS, app, time, input, log, states. No rendering, windowing, or audio.
# The `full` feature turns on the rest of Bevy.
bevy = { version = "0.19.1", default-features = false, features = [
  "std",
  "bevy_state",
  "bevy_log",
  "multi_threaded",
] }

rand = "0.10"
log = { version = "*", features = ["max_level_debug", "release_max_level_error"] }
# Compile low-severity logs out of web builds for performance.
tracing = { version = "0.1", features = ["max_level_debug", "release_max_level_warn"] }

# Physics and input mapping are only used by the graphical scenes.
avian3d = { version = "0.7", optional = true }
leafwing-input-manager = { version = "0.21", optional = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# These dependencies are only needed for full builds with UI
bevy-inspector-egui = { version = "0.37", optional = true }
# bevy-inspector-egui 0.37 needs bevy_egui 0.40 and egui 0.34.
bevy_egui = { version = "0.40", optional = true }
egui = { version = "0.34", optional = true }

# TUI dependencies for terminal-based cell monitoring
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }

[features]
default = [
  # Default to a native dev build with full features.
  "full",
]

# Full build with graphics, audio, physics, and the egui inspector
full = [
  "bevy/default",
  "bevy/bevy_gizmos",
  "bevy/bevy_ui_debug",
  "dep:avian3d",
  "dep:leafwing-input-manager",
  "dep:bevy-inspector-egui",
  "dep:bevy_egui",
  "dep:egui",
  "dev_native",
]

# Simulation only: no graphics, audio, or UI.
# Use with `--no-default-features --features headless`.
headless = ["bevy/dynamic_linking"]

# Terminal monitor for cell state. Opt-in: it takes over the terminal.
tui = ["dep:ratatui", "dep:crossterm"]

dev = [
  # Improve compile times for dev builds by linking Bevy as a dynamic library.
  "bevy/dynamic_linking",
  "bevy/bevy_dev_tools",
]
dev_native = [
  "dev",
  # Enable asset hot reloading for native dev builds.
  "bevy/file_watcher",
  # Enable embedded asset hot reloading for native dev builds.
  "bevy/embedded_watcher",
]

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3
# No debug info for dependencies: smaller target dir and faster links.
# Our own crate keeps full debug info.
debug = false

# Remove expensive debug assertions due to <https://github.com/bevyengine/bevy/issues/14291>
[profile.dev.package.wgpu-types]
debug-assertions = false

# The default profile is optimized for Wasm builds because
# that's what [Trunk reads](https://github.com/trunk-rs/trunk/issues/605).
# Optimize for size in the wasm-release profile to reduce load times and bandwidth usage on web.
[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"
# Optimize with size in mind (also try "z", sometimes it is better).
# Slightly slows compile times, great improvements to file size and runtime performance.
opt-level = "s"
# Strip all debugging information from the binary to slightly reduce file size.
strip = "debuginfo"

# Override some settings for native builds.
[profile.release-native]
# Default to release profile values.
inherits = "release"
# Optimize with performance in mind.
opt-level = 3
# Keep debug information in the binary.
strip = "none"

# TUI tests only build when the opt-in `tui` feature is on.
[[test]]
name = "tui_basic_test"
required-features = ["tui"]

[[test]]
name = "tui_integration_test"
required-features = ["tui"]

[dev-dependencies]
env_logger = "0.11"
proptest = "1.12"
approx = "0.5"
