[package]
name = "metabolistic3d"
version = "0.1.0"
edition = "2024"
# `cargo run` starts the game; `cargo levels` runs the level tool.
default-run = "metabolistic3d"

[lib]
name = "metabolistic3d"
path = "src/lib.rs"
# No doctests: each one is a separate crate that links all of Bevy, and the
# examples in the doc comments are `no_run` or not Rust.
doctest = false

# main.rs has no tests: do not build a test harness for it.
[[bin]]
name = "metabolistic3d"
path = "src/main.rs"
test = false

# `cargo test` does not build the example.
[[example]]
name = "offscreen_spike"
test = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Core Bevy: ECS, app, time, input, log, states. No rendering, windowing, or audio.
# The `full` feature turns on the rest of Bevy.
bevy = { version = "0.19.1", default-features = false, features = [
  "std",
  "bevy_state",
  "bevy_log",
  "multi_threaded",
] }

rand = "0.10"
log = { version = "*", features = ["max_level_debug", "release_max_level_error"] }
# Compile low-severity logs out of web builds for performance.
tracing = { version = "0.1", features = ["max_level_debug", "release_max_level_warn"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# PNG previews of levels (the `levels` tool). Already in the tree through Bevy.
png = "0.18"

# These dependencies are only needed for full builds with UI
# 2D physics for the player cell. Full builds only: `headless` must not need it.
avian2d = { version = "0.7", optional = true, default-features = false, features = [
  "2d",
  "f32",
  "parry-f32",
  "parallel",
  # The pilus joint (`world::pilus_view`). Without it avian ignores all joints.
  "xpbd_joints",
] }
# No default features: they pull in the 3D renderer (bevy_pbr) and reflect
# docs for every type. The game is 2D only.
bevy-inspector-egui = { version = "0.37", optional = true, default-features = false, features = [
  "2d",
  "bevy_gizmos",
  "egui_clipboard",
] }
# bevy-inspector-egui 0.37 needs bevy_egui 0.40 and egui 0.34.
bevy_egui = { version = "0.40", optional = true }
egui = { version = "0.34", optional = true }
# Particles (vent smoke and sparkles). 0.7 is the line for Bevy 0.19.
bevy_enoki = { version = "0.7", optional = true }

# TUI dependencies for terminal-based cell monitoring
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }

[features]
default = [
  # Default to a native dev build with full features.
  "full",
]

# Full build with 2D graphics, UI, and the egui inspector.
# The Bevy parts are listed one by one instead of `bevy/default`: the game does
# not use 3D (pbr, gltf), audio, gamepads (gilrs), scenes, UI widgets or
# sysinfo, and each of them adds compile time and size to the Bevy dylib.
# Add a part here when the game starts to use it (see Bevy's Cargo.toml for
# the names).
full = [
  "bevy/default_app",
  "bevy/std",
  "bevy/multi_threaded",
  "bevy/bevy_winit",
  "bevy/bevy_clipboard",
  "bevy/default_font",
  "bevy/custom_cursor",
  # Web and Linux window backends. They compile nothing on macOS.
  "bevy/webgl2",
  "bevy/x11",
  "bevy/wayland",
  # Sprites, meshes, cameras, gizmos, text, png and the 2D render pipeline.
  "bevy/2d_bevy_render",
  "bevy/ui_api",
  "bevy/ui_bevy_render",
  # `Pickable` and `Pointer<..>` events (the Manage map).
  "bevy/bevy_picking",
  "bevy/sprite_picking",
  "bevy/ui_picking",
  "bevy/bevy_ui_debug",
  "dep:avian2d",
  "dep:bevy-inspector-egui",
  "dep:bevy_egui",
  "dep:bevy_enoki",
  "dep:egui",
  "dev_native",
]

# Simulation only: no graphics, audio, or UI.
# Use with `--no-default-features --features headless`.
headless = ["bevy/dynamic_linking"]

# Terminal monitor for cell state. Opt-in: it takes over the terminal.
tui = ["dep:ratatui", "dep:crossterm"]

dev = [
  # Improve compile times for dev builds by linking Bevy as a dynamic library.
  "bevy/dynamic_linking",
  # No `bevy/bevy_dev_tools`: the game does not use it, and it pulls in
  # bevy_pbr. The UI outlines (backquote) come from `bevy/bevy_ui_debug`.
]
dev_native = [
  "dev",
  # Enable asset hot reloading for native dev builds.
  "bevy/file_watcher",
  # Enable embedded asset hot reloading for native dev builds.
  "bevy/embedded_watcher",
]

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1
# File and line numbers for backtraces and panics, but no variable or type
# info. Faster codegen and links, and less memory when agents build in parallel.
# Set `debug = true` for a session in a debugger.
debug = "line-tables-only"

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3
# No debug info for dependencies: smaller target dir and faster links.
# Our own crate keeps line tables only (see `[profile.dev]`).
debug = false

# Remove expensive debug assertions due to <https://github.com/bevyengine/bevy/issues/14291>
[profile.dev.package.wgpu-types]
debug-assertions = false

# The default profile is optimized for Wasm builds because
# that's what [Trunk reads](https://github.com/trunk-rs/trunk/issues/605).
# Optimize for size in the wasm-release profile to reduce load times and bandwidth usage on web.
[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"
# Optimize with size in mind (also try "z", sometimes it is better).
# Slightly slows compile times, great improvements to file size and runtime performance.
opt-level = "s"
# Strip all debugging information from the binary to slightly reduce file size.
strip = "debuginfo"

# Override some settings for native builds.
[profile.release-native]
# Default to release profile values.
inherits = "release"
# Optimize with performance in mind.
opt-level = 3
# Keep debug information in the binary.
strip = "none"

# TUI tests only build when the opt-in `tui` feature is on.
[[test]]
name = "tui_basic_test"
required-features = ["tui"]

[[test]]
name = "tui_integration_test"
required-features = ["tui"]

[dev-dependencies]
env_logger = "0.11"
proptest = "1.12"
approx = "0.5"
