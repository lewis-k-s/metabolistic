<title>Metabolistic Level Atlas</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<!--
  The level viewer. `cargo levels bake` puts the level data in place of the
  marker in the "data" script below and writes target/levels/viewer.html.
  Rendering is one function per layer (see `drawMap`), so editing tools can
  later reuse the same drawing and the same coordinate helpers (toCanvas,
  toWorld). Level data is the bake JSON: see src/bin/levels/bake.rs.
-->
<style>
/* Layout: survey-console. Stage tabs on top; a panel of map cards to compare
   options, or one map with a side sheet of facts. Dark only: the abyss is the
   subject, and the maps are drawn on deep water. */
:root {
  color-scheme: dark;
  --abyss: #060b14;
  --hull: #0c1422;
  --hull-2: #111c2e;
  --seam: #1e2c44;
  --ink: #d9e3ef;
  --ink-dim: #8090a8;
  --sulfur: #e9c74a;
  --heat: #ff6a2a;
  --mineral: #3fd4a8;
  --uv: #b282ff;
  --prey: #74e374;
  --hostile: #ff5050;
  --ally: #66b2ff;
  --gate: #f266f2;
  --ok: #57d68d;
  --bad: #ff7a5c;
  --display: "Chakra Petch", "Avenir Next Condensed", "Arial Narrow", sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --step--1: 0.8rem;
  --step-0: 0.9rem;
  --step-1: 1.05rem;
  --step-2: 1.4rem;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--abyss);
  color: var(--ink);
  font-family: var(--body);
  font-size: var(--step-0);
  line-height: 1.45;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--sulfur); outline-offset: 2px; }

.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--abyss) 92%, transparent);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--seam);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px;
}
.brand { font-family: var(--display); font-weight: 600; font-size: var(--step-1); letter-spacing: 0.06em; text-transform: uppercase; }
.brand small { color: var(--ink-dim); font-weight: 500; letter-spacing: 0.1em; margin-left: 8px; font-size: var(--step--1); }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.tab {
  background: transparent; border: 1px solid var(--seam); border-radius: 3px;
  padding: 4px 10px; cursor: pointer; font-family: var(--mono); font-size: var(--step--1);
  color: var(--ink-dim);
}
.tab[aria-pressed="true"] { color: var(--abyss); background: var(--sulfur); border-color: var(--sulfur); }
.tab:hover:not([aria-pressed="true"]) { color: var(--ink); border-color: var(--ink-dim); }
.spacer { flex: 1; }
.hint { color: var(--ink-dim); font-size: var(--step--1); font-family: var(--mono); }

main {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
}

/* Panel of options */
.panel { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 16px; align-items: start; }
.card {
  background: var(--hull); border: 1px solid var(--seam); border-radius: 4px;
  display: flex; flex-direction: column; min-width: 0; cursor: pointer; text-align: left; padding: 0;
}
.card:hover { border-color: var(--ink-dim); }
.card canvas { width: 100%; display: block; border-bottom: 1px solid var(--seam); border-radius: 4px 4px 0 0; image-rendering: auto; }
.card-body { padding: 12px 14px 14px; display: grid; gap: 8px; }
.card h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: var(--step-1); letter-spacing: 0.02em; text-wrap: balance; }
.card .id { font-family: var(--mono); font-size: var(--step--1); color: var(--ink-dim); }
.card p { margin: 0; color: var(--ink-dim); }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--seam);
  border-radius: 999px; padding: 1px 8px 1px 4px; font-size: var(--step--1); font-family: var(--mono);
  background: var(--hull-2); white-space: nowrap;
}
.chip img { width: 16px; height: 16px; image-rendering: pixelated; }
.chip.plain { padding-left: 8px; }
.status { font-family: var(--mono); font-size: var(--step--1); padding: 1px 7px; border-radius: 3px; border: 1px solid; }
.status.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 50%, transparent); }
.status.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, transparent); }

/* Inspect */
.inspect { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 400px); gap: 18px; align-items: start; }
@media (max-width: 960px) { .inspect { grid-template-columns: minmax(0, 1fr); } }
.mapwrap { position: relative; min-width: 0; }
.layers { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.layer {
  border: 1px solid var(--seam); background: var(--hull); border-radius: 3px; padding: 3px 8px;
  cursor: pointer; font-family: var(--mono); font-size: var(--step--1); color: var(--ink-dim);
  display: inline-flex; align-items: center; gap: 6px;
}
.layer i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--ink-dim)); opacity: 0.35; }
.layer[aria-pressed="true"] { color: var(--ink); border-color: var(--ink-dim); }
.layer[aria-pressed="true"] i { opacity: 1; }
#map { width: 100%; display: block; border: 1px solid var(--seam); border-radius: 4px; cursor: crosshair; background: var(--hull); }
.readout {
  position: absolute; pointer-events: none; background: color-mix(in srgb, var(--abyss) 94%, transparent);
  border: 1px solid var(--seam); border-radius: 3px; padding: 6px 8px; font-family: var(--mono);
  font-size: 11.5px; line-height: 1.5; white-space: pre; z-index: 3; font-variant-numeric: tabular-nums;
}
.mapfoot { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; color: var(--ink-dim); font-family: var(--mono); font-size: var(--step--1); }
.toast { color: var(--sulfur); }

.sheet { display: grid; gap: 18px; min-width: 0; }
.sheet h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: var(--step-2); line-height: 1.15; text-wrap: balance; }
.sheet h3 {
  margin: 0 0 8px; font-family: var(--display); font-weight: 500; font-size: var(--step--1);
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim);
}
.sheet p { margin: 0; max-width: 65ch; }
.sheet ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.pillars li::marker { color: var(--sulfur); }
.proposals li::marker { color: var(--uv); }
.mob { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 4px 10px; padding: 9px 0; border-top: 1px solid var(--seam); align-items: start; }
.mob:first-of-type { border-top: 0; padding-top: 0; }
.mob img { width: 32px; height: 32px; image-rendering: pixelated; background: var(--hull-2); border-radius: 3px; border: 1px solid var(--seam); }
.mob b { font-weight: 700; }
.mob .count { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--ink-dim); }
.mob .meta { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 4px; }
.mob .behaviour { grid-column: 2 / 4; color: var(--ink-dim); font-size: var(--step--1); }
.mob .behaviour em { color: var(--uv); font-style: normal; font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; margin-right: 4px; }
.role { font-family: var(--mono); font-size: 11px; padding: 0 6px; border-radius: 3px; border: 1px solid currentColor; }
.role.prey { color: var(--prey); } .role.hostile { color: var(--hostile); } .role.ally { color: var(--ally); } .role.key { color: var(--sulfur); }
table.facts { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: var(--step--1); font-variant-numeric: tabular-nums; }
table.facts td, table.facts th { padding: 3px 6px 3px 0; text-align: left; border-top: 1px solid var(--seam); vertical-align: top; }
table.facts th { color: var(--ink-dim); font-weight: 400; }
.changed { color: var(--sulfur); }
.errors li { color: var(--bad); font-family: var(--mono); font-size: var(--step--1); }
.empty { color: var(--ink-dim); padding: 40px 0; max-width: 60ch; }
.empty code { font-family: var(--mono); color: var(--sulfur); }
.back { background: none; border: 0; color: var(--ink-dim); cursor: pointer; padding: 0; font-family: var(--mono); font-size: var(--step--1); }
.back:hover { color: var(--ink); }
/* Edit mode */
.edit-bar { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin: 8px 0; padding: 8px; border: 1px solid var(--seam); border-radius: 4px; background: var(--hull); }
.edit-bar .group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.btn { border: 1px solid var(--seam); background: var(--hull-2); border-radius: 3px; padding: 3px 9px; cursor: pointer; font-family: var(--mono); font-size: var(--step--1); color: var(--ink-dim); }
.btn:hover { color: var(--ink); border-color: var(--ink-dim); }
.btn[aria-pressed="true"] { color: var(--abyss); background: var(--sulfur); border-color: var(--sulfur); }
.btn.primary { color: var(--ink); border-color: var(--sulfur); }
.swatch { width: 28px; padding: 3px 0; text-align: center; font-weight: 600; }
.edit-status { font-family: var(--mono); font-size: var(--step--1); color: var(--ink-dim); }
.edit-status.bad { color: var(--bad); }
.edit-status.ok { color: var(--ok); }
#map.editing { cursor: grab; }
#map.editing.paint, #map.editing.spawn { cursor: copy; }
#map.editing.erase { cursor: not-allowed; }
.note-edit { display: grid; gap: 4px; padding: 6px 0; border-top: 1px solid var(--seam); }
.note-edit textarea, .json-out { width: 100%; background: var(--hull-2); color: var(--ink); border: 1px solid var(--seam); border-radius: 3px; font: inherit; font-size: var(--step--1); padding: 4px 6px; resize: vertical; }
.json-out { font-family: var(--mono); height: 140px; }
.edit-bar select { background: var(--hull-2); color: var(--ink); border: 1px solid var(--seam); border-radius: 3px; font: inherit; font-size: var(--step--1); padding: 2px 4px; }
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color 120ms; } }
</style>

<header class="top">
  <div class="brand">Level Atlas<small id="count"></small></div>
  <nav class="tabs" id="stages" aria-label="Stage"></nav>
  <div class="spacer"></div>
  <span class="hint" id="hint">click a map to inspect it</span>

<main id="main"></main>

<script id="data" type="application/json">"__LEVEL_DATA__"</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent);
const STAGE_NAMES = { Vents: "Deep vents", ShallowWater: "Shallow water", Land: "Land" };
const CSS = getComputedStyle(document.documentElement);
const tok = (name) => CSS.getPropertyValue(name).trim();
const ROLE_COLOUR = { prey: tok("--prey"), hostile: tok("--hostile"), ally: tok("--ally"), gate: tok("--gate"), key: tok("--sulfur") };
const WALL_COLOUR = { Tough: "#6b615c", Wall: "#9e5273", Pore: "#f2c773", Mat: "#3f7a3d", Waxy: "#c7bd6b" };
const MOB_RADIUS = { prey: 11, ally: 11, hostile: 22, gate: 34 };
const LAYERS = [
  ["Heat", "--heat"], ["Minerals", "--mineral"], ["Light", "--uv"], ["O2", "--ally"], ["Water", "--ally"],
  ["Damage", "--hostile"], ["Walls", "--ink-dim"], ["Zones", "--sulfur"], ["Creatures", "--prey"],
  ["Notes", "--sulfur"], ["Currents", "--mineral"], ["Grid", "--seam"], ["Raster", "--seam"],
];

const store = {
  get(key, fallback) { try { const v = localStorage.getItem("atlas." + key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem("atlas." + key, JSON.stringify(value)); } catch { /* storage is optional */ } },
};
const state = {
  stage: "Vents",
  level: null,
  layers: store.get("layers", { Heat: true, Minerals: true, Light: true, O2: true, Water: true, Damage: true, Walls: true, Zones: true, Creatures: true, Notes: true, Currents: false, Grid: false }),
};

const sprites = {};
if (DATA && DATA.sprites) {
  for (const [name, uri] of Object.entries(DATA.sprites)) { const img = new Image(); img.src = uri; sprites[name] = img; }
}

const el = (tag, attrs = {}, ...kids) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v; else if (k === "text") node.textContent = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v); else node.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) node.append(kid);
  return node;
};

// --- Coordinates: world units (y up, origin at the centre) <-> canvas pixels.
function view(level, canvasWidth) {
  const [w, h] = level.size, cell = level.cell;
  const s = canvasWidth / w; // canvas px per grid cell
  const [ox, oy] = level.origin;
  return {
    s, w, h, cell, width: w * s, height: h * s,
    toCanvas: (x, y) => [(x - ox) / cell * s, h * s - (y - oy) / cell * s],
    toWorld: (px, py) => [ox + px / s * cell, oy + (h * s - py) / s * cell],
    len: (d) => d / cell * s,
  };
}

/** Bilinear sample between cell centres, like EnvGrid::sample. */
function sample(level, channel, x, y) {
  const values = level.channels[channel];
  if (!values) return 0;
  const [w, h] = level.size;
  const gx = (x - level.origin[0]) / level.cell - 0.5, gy = (y - level.origin[1]) / level.cell - 0.5;
  const x0 = Math.max(0, Math.min(w - 1, Math.floor(gx))), y0 = Math.max(0, Math.min(h - 1, Math.floor(gy)));
  const x1 = Math.min(w - 1, x0 + 1), y1 = Math.min(h - 1, y0 + 1);
  const tx = Math.max(0, Math.min(1, gx - x0)), ty = Math.max(0, Math.min(1, gy - y0));
  const at = (i, j) => values[j * w + i];
  return (at(x0, y0) * (1 - tx) + at(x1, y0) * tx) * (1 - ty) + (at(x0, y1) * (1 - tx) + at(x1, y1) * tx) * ty;
}

const hex = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16) / 255);
function channelColour(level, channel) {
  if (channel === "Light") return level.uv_fraction > 0.5 ? [0.7, 0.45, 1.0] : [1.0, 0.94, 0.55];
  return { Heat: [1.0, 0.36, 0.12], Minerals: [0.2, 0.85, 0.65], O2: [0.55, 0.75, 1.0], Water: [0.25, 0.45, 0.9] }[channel];
}

/** The channel fields at grid resolution, as an offscreen canvas. */
function fieldImage(level, layers) {
  const [w, h] = level.size;
  const off = document.createElement("canvas");
  off.width = w; off.height = h;
  const ctx = off.getContext("2d");
  const img = ctx.createImageData(w, h);
  const bg = level.background;
  const active = Object.keys(level.channels).filter((c) => layers[c]);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const px = [...bg];
      for (const c of active) {
        const v = level.channels[c][y * w + x];
        if (v <= 0.01) continue;
        const t = Math.sqrt(Math.min(1, v / level.refs[c])) * 0.75, col = channelColour(level, c);
        for (let i = 0; i < 3; i++) px[i] += col[i] * t;
      }
      const o = ((h - 1 - y) * w + x) * 4;
      img.data[o] = Math.min(255, px[0] * 255); img.data[o + 1] = Math.min(255, px[1] * 255);
      img.data[o + 2] = Math.min(255, px[2] * 255); img.data[o + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return off;
}

function dashed(ctx, on) { ctx.setLineDash(on ? [5, 4] : []); }

function drawArrow(ctx, a, b, colour, width = 1.5) {
  const ang = Math.atan2(b[1] - a[1], b[0] - a[0]), head = 6 + width * 2;
  ctx.strokeStyle = colour; ctx.fillStyle = colour; ctx.lineWidth = width;
  ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke();
  dashed(ctx, false);
  ctx.beginPath(); ctx.moveTo(...b);
  ctx.lineTo(b[0] - head * Math.cos(ang - 0.45), b[1] - head * Math.sin(ang - 0.45));
  ctx.lineTo(b[0] - head * Math.cos(ang + 0.45), b[1] - head * Math.sin(ang + 0.45));
  ctx.closePath(); ctx.fill();
}

function mobRole(level, spawn) {
  const mob = level.mobs[spawn.mob];
  return mob.key ? "key" : mob.role;
}

/** Draws the whole map. `detail` adds sprites and labels (the inspect view). */
function drawMap(canvas, level, layers, detail) {
  const dpr = window.devicePixelRatio || 1;
  const cssWidth = canvas.clientWidth || 600;
  const v = view(level, cssWidth);
  canvas.width = Math.round(v.width * dpr); canvas.height = Math.round(v.height * dpr);
  canvas.style.height = v.height + "px";
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
  ctx.drawImage(fieldImage(level, layers), 0, 0, v.width, v.height);
  const [w, h] = level.size;

  if (layers.Grid) {
    ctx.strokeStyle = "rgba(255,255,255,0.05)"; ctx.lineWidth = 1;
    for (let x = 0; x <= w; x++) { ctx.beginPath(); ctx.moveTo(x * v.s, 0); ctx.lineTo(x * v.s, v.height); ctx.stroke(); }
    for (let y = 0; y <= h; y++) { ctx.beginPath(); ctx.moveTo(0, y * v.s); ctx.lineTo(v.width, y * v.s); ctx.stroke(); }
  }
  if (layers.Damage && level.channels.Heat) {
    const heat = level.channels.Heat, hot = (x, y) => x >= 0 && y >= 0 && x < w && y < h && heat[y * w + x] >= level.heat_damage;
    ctx.strokeStyle = tok("--hostile"); ctx.lineWidth = detail ? 1.5 : 1; ctx.beginPath();
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (!hot(x, y)) continue;
      const X = x * v.s, Y = (h - 1 - y) * v.s;
      if (!hot(x - 1, y)) { ctx.moveTo(X, Y); ctx.lineTo(X, Y + v.s); }
      if (!hot(x + 1, y)) { ctx.moveTo(X + v.s, Y); ctx.lineTo(X + v.s, Y + v.s); }
      if (!hot(x, y + 1)) { ctx.moveTo(X, Y); ctx.lineTo(X + v.s, Y); }
      if (!hot(x, y - 1)) { ctx.moveTo(X, Y + v.s); ctx.lineTo(X + v.s, Y + v.s); }
    }
    ctx.stroke();
  }
  if (layers.Walls) {
    for (const [x, y, kind] of level.walls) {
      ctx.globalAlpha = kind === "Mat" ? 0.7 : 1;
      ctx.fillStyle = WALL_COLOUR[kind] || "#888";
      ctx.fillRect(x * v.s, (h - 1 - y) * v.s, v.s + 0.5, v.s + 0.5);
    }
    ctx.globalAlpha = 1;
  }
  if (layers.Walls && level.shapeDraw) drawShapes(ctx, v, level.shapeDraw);
  if (layers.Raster && level.shape_tiles) {
    ctx.fillStyle = "rgba(255,255,255,0.10)"; ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = 1;
    for (const [x, y] of level.shape_tiles) {
      ctx.fillRect(x * v.s, (h - 1 - y) * v.s, v.s, v.s); ctx.strokeRect(x * v.s + 0.5, (h - 1 - y) * v.s + 0.5, v.s - 1, v.s - 1);
    }
  }
  if (layers.Currents) {
    const drift = level.currents.Minerals.drift, mag = Math.hypot(drift[0], drift[1]);
    if (mag > 0.01) {
      const step = Math.max(3, Math.round(w / 12)), len = Math.min(1.6, 0.5 + mag) * v.s;
      ctx.globalAlpha = 0.55;
      for (let y = step / 2; y < h; y += step) for (let x = step / 2; x < w; x += step) {
        const a = [x * v.s, (h - y) * v.s];
        drawArrow(ctx, a, [a[0] + drift[0] / mag * len, a[1] - drift[1] / mag * len], tok("--mineral"), 1);
      }
      ctx.globalAlpha = 1;
    }
  }
  if (layers.Zones) {
    ctx.lineWidth = 1;
    for (const z of level.food_zones) { ctx.strokeStyle = "rgba(233,199,74,0.45)"; dashed(ctx, true); ring(ctx, v, z.at, z.radius); }
    for (const z of level.metal_zones) { ctx.strokeStyle = "rgba(200,205,225,0.45)"; dashed(ctx, true); ring(ctx, v, z.at, z.radius); }
    dashed(ctx, true); ctx.strokeStyle = "rgba(178,130,255,0.55)";
    for (const s of level.shafts) {
      const a = v.toCanvas(s.min[0], s.max[1]), b = v.toCanvas(s.max[0], s.min[1]);
      ctx.strokeRect(a[0], a[1], b[0] - a[0], b[1] - a[1]);
    }
    dashed(ctx, false);
    for (const s of level.shelters) {
      ctx.strokeStyle = "#4ff0e0"; ctx.lineWidth = detail ? 2 : 1.5; ring(ctx, v, s.at, s.radius);

  return redraw;
}

let currentRedraw = null;
function openLevel(id) { state.level = id; location.hash = id.replace(/\//g, "."); route(); }
function route(keepScroll) {
  renderTabs();
  currentRedraw = null;
  const level = DATA.levels.find((l) => l.id === state.level);
  if (level) { state.stage = level.stage; currentRedraw = renderInspect(level); if (!keepScroll) window.scrollTo(0, 0); }
  else { if (location.hash) history.replaceState(null, "", location.pathname); renderPanel(); }
}

if (!DATA || typeof DATA !== "object") {
  document.getElementById("main").replaceChildren(el("div", { class: "empty" },
    el("p", {}, "This is the viewer template without level data. Run ", el("code", { text: "cargo levels bake" }), " and open ", el("code", { text: "target/levels/viewer.html" }), ".")));
} else {
  const fromHash = location.hash.slice(1).replace(/\./g, "/");
  if (DATA.levels.some((l) => l.id === fromHash)) state.level = fromHash;
  route();
  window.addEventListener("hashchange", () => {
    const id = location.hash.slice(1).replace(/\./g, "/");
    const next = DATA.levels.some((l) => l.id === id) ? id : null;
    if (next !== state.level) { state.level = next; route(); }
  });
  let resizeTimer = null;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (currentRedraw) currentRedraw(); else renderPanel(); }, 150);
  });
  // Sprites decode after the first frame; draw again once they are ready.
  Promise.all(Object.values(sprites).map((img) => img.decode().catch(() => {}))).then(() => { if (currentRedraw) currentRedraw(); else if (!state.level) renderPanel(); });
}
</script>
